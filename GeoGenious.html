<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoGenius – Geometry Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      margin: 0;
      padding: 0;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    header {
      background: #00796b;
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .container {
      padding: 20px;
      max-width: 650px;
      margin: auto;
    }
    select, input, button {
      display: block;
      margin: 10px auto;
      padding: 12px;
      font-size: 16px;
      width: 400px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #00796b;
      color: white;
      border: none;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    button:hover {
      background: #004d40;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 16px;
      line-height: 1.6;
      animation: fadeIn 0.5s ease-in;
      width: 400px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    .formula {
      color: #00796b;
      font-weight: bold;
    }
    .answer {
      color: #d32f2f;
      font-weight: bold;
    }
    .error {
      color: #d32f2f;
      font-weight: bold;
      text-align: center;
    }
    .shape-preview {
      margin: 40px auto 20px auto;
    }

    :root {
      --shape-color: #00796b;
    }

    select optgroup {
      font-weight: bold;
      color: #004d40;
    }

    /* 2D Shapes */
    .circle-shape {
      width: 100px; height: 100px;
      background: var(--shape-color);
      border-radius: 50%;
      margin: 10px auto;
    }
    .rectangle-shape {
      width: 140px; height: 80px;
      background: var(--shape-color);
      margin: 10px auto;
    }
    .triangle-shape {
      width: 0; height: 0;
      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 100px solid var(--shape-color);
      margin: 10px auto;
    }
    .parallelogram-shape {
      width: 120px; height: 80px;
      background: var(--shape-color);
      transform: skew(20deg);
      margin: 10px auto;
    }

    /* 3D Shapes */
    .sphere-shape {
      width: 100px; height: 100px;
      background: radial-gradient(circle at 30% 30%, #4db6ac, var(--shape-color));
      border-radius: 50%;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);
      margin: 10px auto;
    }
    .cube-shape {
      width: 100px;
      height: 100px;
      background: var(--shape-color);
      position: relative;
      margin: 10px auto;
    }
    .cube-shape::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 8px;
      width: 100px;
      height: 20px;
      background: #005f56;
      transform: skewX(-40deg);
    }
    .cube-shape::after {
      content: '';
      position: absolute;
      top: -10px;
      left: 100%;
      width: 16px;
      height: 100px;
      background: #004d40;
      transform: skewY(-50deg);
    }
    .cylinder-shape {
      position: relative;
      width: 120px;
      height: 180px;
      margin: 40px auto 20px auto;
      background: linear-gradient(to bottom, #4db6ac, #00796b);
      border-radius: 60px / 25px;
      box-shadow: inset 0 10px 20px rgba(255,255,255,0.2),
                  inset 0 -10px 20px rgba(0,0,0,0.3);
    }
    .cylinder-shape::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 50px;
      background: linear-gradient(to bottom, #81d4fa, #4db6ac);
      border-radius: 60px / 25px;
      box-shadow: inset 0 5px 10px rgba(255,255,255,0.4),
                  0 3px 5px rgba(0,0,0,0.2);
    }

    .cone-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px auto;
    }
    .simple-cone {
      width: 0;
      height: 0;
      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #00796b;
      border-radius: 50% 50% 0 0;
    }
    .cone-base {
      width: 120px;
      height: 30px;
      background: radial-gradient(circle, #4db6ac, #00796b);
      border-radius: 50%;
      margin-top: -15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <header>
    <h1>📐 GeoGenius</h1>
    <h3>Geometry Calculator</h3>
    <p>Created by Zayar Lin – ID: 240702403913</p>
  </header>
  <div class="container">
    <select id="shapeSelector">
        <option value="">Select a shape</option>
      <optgroup label="2D Shapes">
        <option value="circle">Circle</option>
        <option value="rectangle">Rectangle</option>
        <option value="triangle">Triangle</option>
        <option value="parallelogram">Parallelogram</option>
      </optgroup>
      <optgroup label="3D Shapes">
        <option value="sphere">Sphere</option>
        <option value="cube">Cube</option>
        <option value="cylinder">Cylinder</option>
        <option value="cone">Cone</option>
      </optgroup>
    </select>

    <div id="inputFields"></div>
    <button onclick="calculate()">Calculate</button>
    <div class="result" id="resultBox"></div>
    <div class="shape-preview" id="shapePreview"></div>
  </div>

<script>
  function renderInputs() {
    const shape = document.getElementById("shapeSelector").value;
    const inputDiv = document.getElementById("inputFields");
    const previewDiv = document.getElementById("shapePreview");
    inputDiv.innerHTML = "";
    previewDiv.innerHTML = "";

    if (shape === "circle" || shape === "sphere") {
      inputDiv.innerHTML = `<input type="number" id="radius" placeholder="Enter radius">`;
    } else if (shape === "rectangle" || shape === "parallelogram") {
      inputDiv.innerHTML = `
        <input type="number" id="length" placeholder="Enter length">
        <input type="number" id="width" placeholder="Enter width">`;
    } else if (shape === "triangle") {
      inputDiv.innerHTML = `
        <input type="number" id="base" placeholder="Enter base">
        <input type="number" id="height" placeholder="Enter height">`;
    } else if (shape === "cube") {
      inputDiv.innerHTML = `<input type="number" id="side" placeholder="Enter side length">`;
    } else if (shape === "cylinder" || shape === "cone") {
      inputDiv.innerHTML = `
        <input type="number" id="radius" placeholder="Enter radius">
        <input type="number" id="height" placeholder="Enter height">`;
    }

    // Shape preview logic
    if (shape === "cone") {
      previewDiv.innerHTML = `
        <div class="cone-container">
          <div class="simple-cone"></div>
          <div class="cone-base"></div>
        </div>`;
    } else if (shape) {
      previewDiv.innerHTML = `<div class="${shape}-shape"></div>`;
    }
  }

  document.getElementById("shapeSelector").addEventListener("change", renderInputs);

  function calculate() {
    const shape = document.getElementById("shapeSelector").value;
    const resultBox = document.getElementById("resultBox");
    let result = "";

    if (shape === "circle") {
      const r = parseFloat(document.getElementById("radius").value);
      if (isNaN(r)) return showError();
      result = `
        <div><span class="formula">Area = πr²</span><br>
        <span class="answer">= ${(Math.PI * r * r).toFixed(2)}</span></div>`;
    } else if (shape === "rectangle") {
      const l = parseFloat(document.getElementById("length").value);
      const w = parseFloat(document.getElementById("width").value);
      if (isNaN(l) || isNaN(w)) return showError();
      result = `
        <div><span class="formula">Area = l × w</span><br>
        <span class="answer">= ${(l * w).toFixed(2)}</span></div>`;
    } else if (shape === "triangle") {
      const b = parseFloat(document.getElementById("base").value);
      const h = parseFloat(document.getElementById("height").value);
      if (isNaN(b) || isNaN(h)) return showError();
      result = `
        <div><span class="formula">Area = ½ × b × h</span><br>
        <span class="answer">= ${((b * h) / 2).toFixed(2)}</span></div>`;
    } else if (shape === "parallelogram") {
      const l = parseFloat(document.getElementById("length").value);
      const w = parseFloat(document.getElementById("width").value);
      if (isNaN(l) || isNaN(w)) return showError();
      result = `
        <div><span class="formula">Area = base × height</span><br>
        <span class="answer">= ${(l * w).toFixed(2)}</span></div>`;
    } else if (shape === "sphere") {
      const r = parseFloat(document.getElementById("radius").value);
      if (isNaN(r)) return showError();
      result = `
        <div><span class="formula">Volume = ⁴⁄₃πr³</span><br>
        <span class="answer">= ${((4 / 3) * Math.PI * Math.pow(r, 3)).toFixed(2)}</span></div>`;
    } else if (shape === "cube") {
      const s = parseFloat(document.getElementById("side").value);
      if (isNaN(s)) return showError();
      result = `
        <div><span class="formula">Volume = s³</span><br>
        <span class="answer">= ${(Math.pow(s, 3)).toFixed(2)}</span></div>`;
    } else if (shape === "cylinder") {
      const r = parseFloat(document.getElementById("radius").value);
      const h = parseFloat(document.getElementById("height").value);
      if (isNaN(r) || isNaN(h)) return showError();
      result = `
        <div><span class="formula">Volume = πr²h</span><br>
        <span class="answer">= ${(Math.PI * r * r * h).toFixed(2)}</span></div>`;
    } else if (shape === "cone") {
      const r = parseFloat(document.getElementById("radius").value);
      const h = parseFloat(document.getElementById("height").value);
      if (isNaN(r) || isNaN(h)) return showError();
      const slant = Math.sqrt(r * r + h * h);
      result = `
        <div><span class="formula">Volume = ⅓πr²h</span><br>
        <span class="answer">= ${((1 / 3) * Math.PI * r * r * h).toFixed(2)}</span></div>
        <div><span class="formula">Surface Area = πr(r + slant)</span><br>
        <span class="answer">= ${(Math.PI * r * (r + slant)).toFixed(2)}</span></div>`;
    }

    resultBox.innerHTML = result;
  }

  function showError() {
    document.getElementById("resultBox").innerHTML = `<div class="error">Please enter valid numbers.</div>`;
  }
</script>
